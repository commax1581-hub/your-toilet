<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>위치 정확도 뱃지 — 디자인 후보</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f5;--ink:#15202b;--sub:#5b6875;--line:#e3e8ee;--soft:#f5f7fa;--brand:#4338ca;--brand2:#6d28d9;
--ok:#15803d;--ok-s:#e7f6ec;--mid:#0369a1;--mid-s:#e6f2fa;--warn:#b45309;--warn-s:#fdf3e2;--male:#1d4ed8;--female:#dc2626;--acc:#0369a1;--baby:#c2410c;--pub:#0f766e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',sans-serif;font-size:14px;word-break:keep-all}
header{max-width:1400px;margin:0 auto;padding:22px 16px 6px}h1{margin:0 0 4px;font-size:19px}header p{margin:0;color:var(--sub);font-size:13px}
.row{max-width:1400px;margin:0 auto;padding:12px 16px;display:flex;gap:18px;flex-wrap:wrap}
.opt{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;width:330px}
.opt h2{margin:0 0 2px;font-size:15px}.opt .d{color:var(--sub);font-size:12px;margin-bottom:10px}
.card{border:1px solid var(--line);border-radius:14px;padding:10px 11px;margin-bottom:8px}
.h{display:flex;justify-content:space-between;gap:8px}.n{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dist{font-weight:800;white-space:nowrap}.meta{display:flex;gap:6px;align-items:center;margin:6px 0;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:3px;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:800;background:var(--pub);color:#fff}
.st{font-size:12px;font-weight:800;border-radius:7px;padding:2px 7px;background:var(--ok-s);color:var(--ok)}
.fac{display:flex;gap:10px;align-items:center}.fac svg{width:22px;height:22px}.fac span{display:flex;align-items:center;gap:2px;font-weight:800}
.note{font-size:11px;color:var(--sub);margin-top:6px}
/* A: 점 */
.a1,.a2,.a3{display:inline-flex;align-items:center;gap:4px;border-radius:8px;padding:2px 7px;font-size:11px;font-weight:800;letter-spacing:.06em}
.a1{background:var(--ok-s);color:var(--ok)}.a2{background:var(--mid-s);color:var(--mid)}.a3{background:var(--warn-s);color:var(--warn)}
/* B: 막대 */
.bar{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--sub)}
.bar i{display:inline-block;width:5px;height:11px;border-radius:2px;background:#dfe4ea}
.bar.l3 i:nth-child(-n+3){background:var(--ok)}.bar.l2 i:nth-child(-n+2){background:var(--mid)}.bar.l1 i:nth-child(1){background:var(--warn)}
/* C: 아이콘 알약 */
.ic{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px 3px 6px;font-size:11px;font-weight:800;border:1px solid transparent}
.ic svg{width:13px;height:13px}
.ic.l3{background:#fff;border-color:#bfe3cb;color:var(--ok)}.ic.l2{background:#fff;border-color:#b9dcf1;color:var(--mid)}.ic.l1{background:#fff;border-color:#f2d7ad;color:var(--warn)}
/* D: 테두리 없는 미니멀(글자+점) */
.mn{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;color:var(--sub)}
.mn b{width:7px;height:7px;border-radius:50%;display:inline-block}
.mn.l3 b{background:var(--ok)}.mn.l2 b{background:var(--mid)}.mn.l1 b{background:var(--warn)}
.legend{max-width:1400px;margin:0 auto;padding:6px 16px 34px;color:var(--sub);font-size:13px}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="i-male" viewBox="0 0 24 24"><circle cx="12" cy="4" r="2.6" fill="currentColor"/><path d="M8.2 8h7.6a1.6 1.6 0 0 1 1.6 1.6V15h-2.2v7h-2.4v-6h-1.6v6H8.8v-7H6.6V9.6A1.6 1.6 0 0 1 8.2 8z" fill="currentColor"/></symbol>
<symbol id="i-female" viewBox="0 0 24 24"><circle cx="12" cy="4" r="2.6" fill="currentColor"/><path d="M9.6 8h4.8l3.6 9h-3.2v5h-2.2v-5h-1.2v5H9.2v-5H6z" fill="currentColor"/></symbol>
<symbol id="i-acc" viewBox="0 0 24 24"><circle cx="10" cy="3.6" r="2.3" fill="currentColor"/><path d="M8.6 7.4h2.6l.4 4.6H16l2.6 6.4-2 .8-2-5H9.6z" fill="currentColor"/><path d="M7.6 10.2a6 6 0 1 0 7.9 8.6" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
<symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 1 7 7c0 5-7 13-7 13S5 14 5 9a7 7 0 0 1 7-7z" fill="currentColor"/><circle cx="12" cy="9" r="2.6" fill="#fff"/></symbol>
<symbol id="i-build" viewBox="0 0 24 24"><path d="M4 21V6l8-3 8 3v15z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 21v-5h6v5" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
<symbol id="i-q" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.5 9.5a2.6 2.6 0 1 1 3.4 2.5c-.6.2-.9.8-.9 1.5v.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="17" r="1.2" fill="currentColor"/></symbol>
</defs></svg>

<header><h1>위치 정확도 뱃지 — 디자인 후보 4가지</h1>
<p>같은 카드에 같은 정보(건물 확정 / 시설 위치 / 이름으로 추정)를 각각 다른 방식으로. 색만이 아니라 <b>모양·글자</b>로도 구분되게 했습니다.</p></header>

<div class="row" id="r"></div>
<div class="legend">
  <b>공통 규칙</b> — ① 가장 정확한 등급(건물)은 <b>뱃지를 달지 않는다</b>(88%가 여기 해당, 화면이 깨끗해짐) ② 시설·추정만 표시 ③ 색이 안 보여도 글자로 구분됨 ④ 카드는 한 줄, 자세한 문구는 상세 화면.
</div>
<script>
const CARDS=[
 {n:'서울시청 시민청 외부', d:'8m', lv:3, t:'건물'},
 {n:'공촌유수지 체육시설 화장실', d:'380m', lv:2, t:'시설'},
 {n:'○○천 공중화장실1', d:'520m', lv:1, t:'추정'}];
const styles=[
 {h:'A. 점 3단계', d:'●●● / ●● / ● + 글자. 지금 목업에 들어 있는 방식', f:(lv,t)=> lv===3?'':`<span class="a${4-lv}">${'●'.repeat(lv)}${'○'.repeat(3-lv)} ${t}</span>`},
 {h:'B. 신호 막대', d:'와이파이 세기처럼 칸으로. 글자는 작게', f:(lv,t)=> lv===3?'':`<span class="bar l${lv}"><i></i><i></i><i></i> ${t}</span>`},
 {h:'C. 아이콘 알약(테두리)', d:'건물·시설·물음표 아이콘 + 얇은 테두리. 채도가 낮아 카드가 차분함', f:(lv,t)=> lv===3?'':`<span class="ic l${lv}"><svg><use href="#${lv===2?'i-build':'i-q'}"/></svg>${t}</span>`},
 {h:'D. 미니멀 점 하나', d:'작은 점 + 글자만. 가장 조용함', f:(lv,t)=> lv===3?'':`<span class="mn l${lv}"><b></b>${t}</span>`}];
document.getElementById('r').innerHTML=styles.map(s=>`<div class="opt"><h2>${s.h}</h2><div class="d">${s.d}</div>`+
 CARDS.map(c=>`<div class="card"><div class="h"><div class="n">${c.n}</div><div class="dist">${c.d}</div></div>
 <div class="meta"><span class="pill">공중</span><span class="st">22시까지</span>${s.f(c.lv,c.t)}</div>
 <div class="fac"><span style="color:var(--male)"><svg><use href="#i-male"/></svg>6</span><span style="color:var(--female)"><svg><use href="#i-female"/></svg>10</span><span style="color:var(--acc)"><svg><use href="#i-acc"/></svg>2</span></div>
 ${c.lv===2?'<div class="note">시설 위치 기준 · 입구·안내판 확인</div>':c.lv===1?'<div class="note">이름으로 찾은 위치 · 정확하지 않을 수 있어요</div>':''}</div>`).join('')+'</div>').join('');
</script>
</body></html>
