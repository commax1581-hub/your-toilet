<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>배경 후보 샘플</title>
<link href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Noto+Serif+KR:wght@200;300&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#15202b;--sub:#5b6875;--bg:#eef1f5;--brand:#0f766e}
*{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:'Noto Sans KR',sans-serif;color:var(--ink)}
header{max-width:1300px;margin:0 auto;padding:22px 16px 6px} h1{margin:0 0 4px;font-size:19px} header p{margin:0;color:var(--sub);font-size:13px}
.row{max-width:1300px;margin:0 auto;padding:14px 16px 30px;display:flex;flex-wrap:wrap;gap:18px;justify-content:center}
.cell{width:250px} .cap{font-size:12px;color:var(--sub);margin:0 0 6px;min-height:32px} .cap b{color:var(--ink)}
.phone{position:relative;height:556px;border-radius:26px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.14);background:#8b8fb8 url(bg_dusk_candidate.png) center/cover}
.scrim{position:absolute;left:0;right:0;top:0;height:45%;background:linear-gradient(180deg,rgba(30,34,80,.45),rgba(30,34,80,0))}
.title{position:absolute;left:0;right:0;top:62px;text-align:center;color:#fff}
.title .ko{font-size:35px;white-space:nowrap;letter-spacing:.02em;text-shadow:0 2px 12px rgba(20,20,60,.35)}
.title .sub{margin-top:10px;font-size:12px;letter-spacing:.08em;opacity:.95}
.f1 .ko{font-family:'Song Myung'} .f2 .ko{font-family:'Noto Serif KR';font-weight:300}
.cta{position:absolute;left:14px;right:14px;bottom:20px;background:rgba(255,255,255,.95);border-radius:16px;padding:12px;text-align:center}
.cta b{display:block;font-size:16px;margin-bottom:8px} .cta span{display:block;background:var(--brand);color:#fff;border-radius:12px;padding:11px;font-weight:700;font-size:14px}
.cta small{display:block;margin-top:8px;color:var(--sub);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>배경 후보(저녁 길) × "너의 화장실은."</h1>
  <p>받은 파일은 187×417 미리보기 크기라 흐릿함 — 원본(고해상도)으로 바꾸면 선명해짐. 아래 버튼 카드가 이미지 아래쪽(워터마크 자리 포함)을 덮는다.</p>
</header>
<div class="row" id="r"></div>
<script>
const v=[['f1',1,false,'송명 100%','그림 그대로'],['f1',.85,true,'송명 85% + 위쪽 어둡게','제목 대비 보강(추천)'],['f2',.9,true,'본명조 Light 90% + 위쪽 어둡게','가늘고 세련'],['f1',.7,false,'송명 70%','반투명만']];
document.getElementById('r').innerHTML=v.map(([f,o,s,l,d])=>`<div class="cell"><p class="cap"><b>${l}</b> ${d}</p><div class="phone ${f}">${s?'<div class="scrim"></div>':''}
<div class="title" style="opacity:${o}"><div class="ko">너의 화장실은.</div><div class="sub">지금 여기서 가장 가까운 화장실</div></div>
<div class="cta"><b>지금 어디세요?</b><span>내 위치로 찾기</span><small>다른 곳에서 찾기</small></div></div></div>`).join('');
</script>
</body>
</html>
